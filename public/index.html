<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-4 py-2 d-flex align-items-center gap-3">
  <span class="navbar-brand mb-0 h1 fs-5">&#127782; Weather Dashboard</span>
  <!-- Period tabs — rendered from PERIODS in app.ts. -->
  <div class="btn-group btn-group-sm" id="period-tabs"></div>
  <!-- Overlay buttons — rendered from OVERLAYS in app.ts. -->
  <div class="d-flex gap-1 ms-3" id="overlay-buttons"></div>
  <div id="controls" class="d-flex gap-2 align-items-center ms-auto"></div>
  <span id="last-import" class="text-muted small ms-2" title="Last time weather_data.txt was imported"></span>
  <button class="btn btn-sm btn-outline-info ms-2" id="btn-import" title="Re-import weather_data.txt">&#8635; Import</button>
</nav>

<div id="dashboard-view" class="container-fluid px-4 py-3">

  <!-- Chart visibility toggles -->
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <span class="text-muted small">Charts:</span>
    <div class="btn-group btn-group-sm" id="chart-toggles"></div>
    <!-- Missing-day indicator — filled by renderCoverage in app.ts. -->
    <span id="coverage" class="small ms-auto"></span>
  </div>

  <!-- Stat cards — rendered from STAT_CARDS in app.ts. -->
  <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3 mb-3" id="stat-cards"></div>

  <!-- Calendar heatmap — filled by renderCalendar in app.ts when the period
       spans two months or more; empty otherwise. -->
  <div id="calendar"></div>

  <!-- The dashboard view: its chart cards (from CHART_META) and the data table
       under them, both built inside here by renderView in app.ts. -->
  <div id="dashboard"></div>

</div>

<!-- Compare view (hidden until toggled) -->
<div id="compare-view" class="container-fluid px-4 py-3 d-none">
  <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
    <h5 class="mb-0">My data <span class="text-muted">vs</span> <span class="text-info">Baar, CH</span></h5>
    <span class="stat-badge bg-secondary text-light">Source: Open-Meteo</span>
    <span id="cmp-range" class="text-muted small"></span>
    <span id="cmp-status" class="text-warning small"></span>
  </div>

  <!-- Chart cards (from COMPARE_META) and the difference summary under them. -->
  <div id="cmp"></div>
</div>

<!-- Across-years view (hidden until toggled) — same period compared across years -->
<div id="yoy-view" class="container-fluid px-4 py-3 d-none">
  <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
    <h5 class="mb-0" id="yoy-heading">Across years</h5>
    <div id="yoy-unit" class="d-flex gap-2 align-items-center"></div>
    <div id="yoy-controls" class="d-flex gap-2 align-items-center flex-wrap"></div>
    <span id="yoy-status" class="text-warning small"></span>
  </div>

  <!-- One line per year, aligned on the same axis (from YOY_METRICS), over the
       per-year averages table, one column per year. -->
  <!-- Year-to-date precipitation, one line per year (renderYtdShell / loadYtd). -->
  <div id="yoy-ytd"></div>

  <div id="yoy"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<!-- A module: app.ts imports the API shapes from src/shapes.d.ts (types only —
     nothing is emitted), which makes the compiled bundle an ES module. Being
     deferred, it runs after the Chart.js tag above has defined the global it
     reads, and after this markup is parsed — both of which it already relied
     on by sitting at the end of the body. -->
<script type="module" src="app.js"></script>
</body>
</html>
